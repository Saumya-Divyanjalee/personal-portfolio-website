<section class="hero" id="home">
  <div class="hero-grid">
    <div class="hero-text">
      <p class="greeting"><i class="fas fa-hand-sparkles"></i> Hi, I'm Saumya</p>
      <h1 class="gradient-text">Software Engineer | Full-Stack Developer</h1>
      <h2 class="role">{{ currentRole() }}<span class="cursor">|</span></h2>

      <div class="cta">
        <a (click)="scrollToProjects()" class="btn primary" #magneticBtn>
          <i class="fas fa-diagram-project"></i> View My Projects
        </a>
        <a (click)="scrollToContact()" class="btn secondary">
          <i class="fas fa-paper-plane"></i> Let's Connect
        </a>
      </div>
    </div>

    <div class="hero-photo-wrap">
      <div class="orbit-ring ring-1"></div>
      <div class="orbit-ring ring-2"></div>
      <div class="hero-photo">
        <img src="assets/images/profile.jpg" alt="Saumya Divyanjalee"
             onerror="this.style.display='none'; this.parentElement.classList.add('no-photo')">
      </div>
      <div class="badge badge-1"><i class="fas fa-circle-dot"></i> Open to Work</div>
      <div class="badge badge-2"><i class="fas fa-code"></i> Full-Stack</div>
    </div>
  </div>
</section>
