<section class="projects" id="projects" appScrollReveal>
  <h2>Projects</h2>

  <div class="filters">
    @for (cat of categories; track cat) {
      <button [class.active]="activeFilter() === cat" (click)="setFilter(cat)">
        {{ cat }}
      </button>
    }
  </div>

  <div class="project-list">
    @for (p of filteredProjects; track p.id; let i = $index) {
      <div class="project-row" [class.reverse]="i % 2 === 1">
        <div class="project-visual">
          @if (p.image) {
            <img [src]="p.image" [alt]="p.title">
          } @else {
            <i class="fas fa-code"></i>
          }
        </div>
        <div class="project-info">
          <h3>{{ p.title }}</h3>
          <p>{{ p.description }}</p>
          <div class="tech-tags">
            @for (t of p.technologies; track t) {
              <span>{{ t }}</span>
            }
          </div>
          <div class="project-links">
            @if (p.github) {
              <a [href]="p.github" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            }
            @if (p.liveDemo) {
              <a [href]="p.liveDemo" target="_blank"><i class="fas fa-arrow-up-right-from-square"></i> Live Demo</a>
            }
          </div>
        </div>
      </div>
    }
  </div>
</section>
