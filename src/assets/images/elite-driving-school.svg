<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a120d"/>
      <stop offset="100%" stop-color="#0f1f17"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>

  <!-- desktop window frame -->
  <g transform="translate(120,90)">
    <rect width="560" height="380" rx="14" fill="#0f1f17" stroke="#00e676" stroke-opacity="0.4"/>
    <rect width="560" height="36" rx="14" fill="#00e676" fill-opacity="0.08"/>
    <circle cx="24" cy="18" r="6" fill="#00e676" fill-opacity="0.6"/>
    <circle cx="46" cy="18" r="6" fill="#00e676" fill-opacity="0.4"/>
    <circle cx="68" cy="18" r="6" fill="#00e676" fill-opacity="0.25"/>

    <!-- sidebar -->
    <rect x="0" y="36" width="140" height="344" fill="#00e676" fill-opacity="0.04"/>
    <rect x="20" y="60" width="100" height="10" rx="4" fill="#00e676"/>
    <rect x="20" y="90" width="80" height="8" rx="4" fill="#8fa69a" fill-opacity="0.5"/>
    <rect x="20" y="115" width="80" height="8" rx="4" fill="#8fa69a" fill-opacity="0.5"/>
    <rect x="20" y="140" width="80" height="8" rx="4" fill="#8fa69a" fill-opacity="0.5"/>

    <!-- table rows -->
    <g transform="translate(160,70)">
      <rect width="380" height="30" rx="6" fill="#00e676" fill-opacity="0.1"/>
      <rect x="16" y="10" width="150" height="10" rx="4" fill="#00e676"/>
      <rect width="380" height="30" rx="6" fill="#00e676" fill-opacity="0.04" transform="translate(0,40)"/>
      <rect x="16" y="50" width="120" height="8" rx="4" fill="#e8fbef" fill-opacity="0.5"/>
      <rect width="380" height="30" rx="6" fill="#00e676" fill-opacity="0.04" transform="translate(0,80)"/>
      <rect x="16" y="90" width="140" height="8" rx="4" fill="#e8fbef" fill-opacity="0.5"/>
      <rect width="380" height="30" rx="6" fill="#00e676" fill-opacity="0.04" transform="translate(0,120)"/>
      <rect x="16" y="130" width="100" height="8" rx="4" fill="#e8fbef" fill-opacity="0.5"/>
    </g>
  </g>

  <!-- steering wheel motif -->
  <g transform="translate(650,470)">
    <circle r="46" fill="none" stroke="#00e676" stroke-width="6"/>
    <circle r="14" fill="#0f1f17" stroke="#00e676" stroke-width="3"/>
    <line x1="0" y1="-46" x2="0" y2="-14" stroke="#00e676" stroke-width="4"/>
    <line x1="-40" y1="23" x2="-12" y2="7" stroke="#00e676" stroke-width="4"/>
    <line x1="40" y1="23" x2="12" y2="7" stroke="#00e676" stroke-width="4"/>
  </g>

  <text x="400" y="560" text-anchor="middle" font-family="monospace" font-size="14" fill="#8fa69a" letter-spacing="2">DESKTOP MANAGEMENT SYSTEM</text>
</svg>
