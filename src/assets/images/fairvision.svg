<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a120d"/>
      <stop offset="100%" stop-color="#0f1f17"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- neural network nodes -->
  <g stroke="#00e676" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="140" y1="150" x2="340" y2="100"/>
    <line x1="140" y1="150" x2="340" y2="220"/>
    <line x1="140" y1="150" x2="340" y2="340"/>
    <line x1="140" y1="300" x2="340" y2="100"/>
    <line x1="140" y1="300" x2="340" y2="220"/>
    <line x1="140" y1="300" x2="340" y2="340"/>
    <line x1="140" y1="450" x2="340" y2="220"/>
    <line x1="140" y1="450" x2="340" y2="340"/>
    <line x1="340" y1="100" x2="540" y2="220"/>
    <line x1="340" y1="220" x2="540" y2="220"/>
    <line x1="340" y1="340" x2="540" y2="220"/>
  </g>
  <g fill="#00e676">
    <circle cx="140" cy="150" r="7"/>
    <circle cx="140" cy="300" r="7"/>
    <circle cx="140" cy="450" r="7"/>
    <circle cx="340" cy="100" r="7" fill-opacity="0.8"/>
    <circle cx="340" cy="220" r="7" fill-opacity="0.8"/>
    <circle cx="340" cy="340" r="7" fill-opacity="0.8"/>
    <circle cx="540" cy="220" r="10"/>
  </g>

  <!-- scan / eye motif -->
  <g transform="translate(620,300)">
    <ellipse cx="0" cy="0" rx="70" ry="42" fill="none" stroke="#00e676" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="20" fill="#0f1f17" stroke="#00e676" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="7" fill="#00e676"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#00e676" stroke-opacity="0.4" stroke-dasharray="3 4"/>
  </g>

  <!-- bar comparison -->
  <g transform="translate(120,480)">
    <rect x="0" y="0" width="22" height="60" fill="#00e676" fill-opacity="0.35" transform="translate(0,-60)"/>
    <rect x="30" y="0" width="22" height="90" fill="#00e676" transform="translate(0,-90)"/>
    <rect x="60" y="0" width="22" height="45" fill="#00e676" fill-opacity="0.35" transform="translate(0,-45)"/>
    <rect x="90" y="0" width="22" height="75" fill="#00e676" fill-opacity="0.7" transform="translate(0,-75)"/>
  </g>

  <text x="400" y="560" text-anchor="middle" font-family="monospace" font-size="14" fill="#8fa69a" letter-spacing="2">CNN FAIRNESS CLASSIFIER</text>
</svg>
