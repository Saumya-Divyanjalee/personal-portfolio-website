<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a120d"/>
      <stop offset="100%" stop-color="#0f1f17"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>

  <!-- grid texture -->
  <g stroke="#00e676" stroke-opacity="0.06">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- map pin route -->
  <path d="M120 420 Q 300 380 400 300 T 680 200" stroke="url(#glow1)" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
  <circle cx="120" cy="420" r="8" fill="#00e676"/>
  <circle cx="680" cy="200" r="8" fill="#00e676"/>

  <!-- car body (abstract) -->
  <g transform="translate(230,300)">
    <rect x="0" y="40" width="340" height="90" rx="20" fill="#0f1f17" stroke="#00e676" stroke-width="2"/>
    <path d="M40 40 L100 -20 L260 -20 L320 40 Z" fill="#0f1f17" stroke="#00e676" stroke-width="2"/>
    <rect x="110" y="-10" width="60" height="45" rx="6" fill="#00e676" fill-opacity="0.15" stroke="#00e676" stroke-width="1.5"/>
    <rect x="185" y="-10" width="60" height="45" rx="6" fill="#00e676" fill-opacity="0.15" stroke="#00e676" stroke-width="1.5"/>
    <circle cx="70" cy="135" r="30" fill="#0a120d" stroke="#00e676" stroke-width="3"/>
    <circle cx="270" cy="135" r="30" fill="#0a120d" stroke="#00e676" stroke-width="3"/>
    <circle cx="70" cy="135" r="10" fill="#00e676"/>
    <circle cx="270" cy="135" r="10" fill="#00e676"/>
  </g>

  <!-- booking card -->
  <g transform="translate(540,90)">
    <rect width="200" height="130" rx="12" fill="#0f1f17" stroke="#00e676" stroke-opacity="0.4"/>
    <rect x="20" y="20" width="90" height="10" rx="4" fill="#00e676"/>
    <rect x="20" y="45" width="160" height="8" rx="4" fill="#8fa69a" fill-opacity="0.5"/>
    <rect x="20" y="62" width="120" height="8" rx="4" fill="#8fa69a" fill-opacity="0.5"/>
    <rect x="20" y="95" width="60" height="22" rx="6" fill="#00e676"/>
  </g>

  <text x="400" y="560" text-anchor="middle" font-family="monospace" font-size="14" fill="#8fa69a" letter-spacing="2">VEHICLE RENTAL PLATFORM</text>
</svg>
