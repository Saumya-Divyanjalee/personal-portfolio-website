<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a120d"/>
      <stop offset="100%" stop-color="#0f1f17"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>

  <g stroke="#00e676" stroke-opacity="0.06">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- dashboard card -->
  <g transform="translate(80,80)">
    <rect width="380" height="300" rx="16" fill="#0f1f17" stroke="#00e676" stroke-opacity="0.35"/>
    <rect x="24" y="24" width="120" height="14" rx="6" fill="#00e676"/>
    <rect x="24" y="52" width="200" height="8" rx="4" fill="#8fa69a" fill-opacity="0.5"/>

    <!-- task rows -->
    <g transform="translate(24,90)">
      <rect width="332" height="36" rx="8" fill="#00e676" fill-opacity="0.08"/>
      <circle cx="18" cy="18" r="8" fill="none" stroke="#00e676" stroke-width="2"/>
      <rect x="36" y="12" width="200" height="10" rx="4" fill="#e8fbef" fill-opacity="0.6"/>
    </g>
    <g transform="translate(24,136)">
      <rect width="332" height="36" rx="8" fill="#00e676" fill-opacity="0.08"/>
      <path d="M10 18 l6 6 l12 -14" stroke="#00e676" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="36" y="12" width="160" height="10" rx="4" fill="#e8fbef" fill-opacity="0.4"/>
    </g>
    <g transform="translate(24,182)">
      <rect width="332" height="36" rx="8" fill="#00e676" fill-opacity="0.08"/>
      <circle cx="18" cy="18" r="8" fill="none" stroke="#00e676" stroke-width="2"/>
      <rect x="36" y="12" width="230" height="10" rx="4" fill="#e8fbef" fill-opacity="0.6"/>
    </g>

    <!-- mini chart -->
    <g transform="translate(24,236)">
      <rect x="0" y="20" width="16" height="30" fill="#00e676" fill-opacity="0.4"/>
      <rect x="24" y="10" width="16" height="40" fill="#00e676" fill-opacity="0.6"/>
      <rect x="48" y="0" width="16" height="50" fill="#00e676"/>
      <rect x="72" y="16" width="16" height="34" fill="#00e676" fill-opacity="0.5"/>
    </g>
  </g>

  <!-- AI assistant orb -->
  <g transform="translate(560,150)">
    <circle cx="0" cy="0" r="90" fill="#00e676" fill-opacity="0.06"/>
    <circle cx="0" cy="0" r="60" fill="#0f1f17" stroke="#00e676" stroke-width="2"/>
    <circle cx="-18" cy="-8" r="6" fill="#00e676"/>
    <circle cx="18" cy="-8" r="6" fill="#00e676"/>
    <path d="M-20 18 Q0 32 20 18" stroke="#00e676" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00e676" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="400" y="560" text-anchor="middle" font-family="monospace" font-size="14" fill="#8fa69a" letter-spacing="2">AI PRODUCTIVITY PLATFORM</text>
</svg>
